name: Bancos de pruebas de MedCheck
description: >
  Ejecuta todos los bancos sobre el árbol de trabajo tal como está en ese momento.
  Un solo sitio define el bucle, la guarda de arranque y la versión de Node, para que el CI de
  `main` y el gate de los ETL sean literalmente el mismo vigilante y no dos que se parecen.

# POR QUÉ UNA ACCIÓN COMPUESTA Y NO UN `workflow_call`. Un workflow reutilizable corre en OTRO
# runner con un checkout limpio: vería `main`, no el árbol que el ETL acaba de mutar, que es
# justo lo único que aquí hay que probar. Una acción compuesta corre dentro del mismo job y sobre
# el mismo workspace. Si alguna vez se convierte esto en `workflow_call`, el gate saldrá verde
# sin haber mirado el índice nuevo: el aprobado en falso de siempre.

inputs:
  titulo:
    description: Encabezado del resumen, para distinguir el CI del gate de un ETL.
    required: false
    default: Bancos de pruebas de MedCheck
  node-version:
    description: >
      Versión de Node. Se fija aquí y no en cada llamante a propósito: el gate tiene que correr en
      la MISMA que el CI, porque un banco que pasa en 22 y falla en 24 haría que publicar y probar
      dijeran cosas distintas.
    required: false
    default: '24'
  minimo:
    description: >
      GUARDA DE ARRANQUE. Menos bancos de los esperados es rojo. Sin ella, renombrar el prefijo
      dejaría el bucle vacío y esto saldría verde sin probar una línea.
    required: false
    default: '36'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        # El repo no tiene `package.json`: node puro, sin `npm ci` y sin caché que configurar.
        node-version: ${{ inputs.node-version }}

    - name: Ejecutar los bancos
      shell: bash
      env:
        MC_TITULO: ${{ inputs.titulo }}
        MC_MINIMO: ${{ inputs.minimo }}
      run: |
        # Actions corre los `run` con `-e`: sin esto, el primer banco en rojo abortaría el
        # script y los demás no llegarían a ejecutarse. Los códigos se llevan a mano.
        set +e
        set -u

        mapfile -t BANCOS < <(ls scripts/medcheck-test-*.mjs 2>/dev/null | sort)

        if [ "${#BANCOS[@]}" -lt "$MC_MINIMO" ]; then
          echo "::error::Se esperaban al menos $MC_MINIMO bancos y se han encontrado ${#BANCOS[@]}. Un verde aquí no significaría nada."
          exit 1
        fi

        fallos=0
        saltos=0
        rojos=""

        {
          echo "## $MC_TITULO"
          echo
          echo "| Banco | Salida | Inconclusos |"
          echo "|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"

        for f in "${BANCOS[@]}"; do
          nombre=$(basename "$f" .mjs)
          echo "::group::$nombre"
          salida=$(node "$f" 2>&1)
          codigo=$?
          echo "$salida"
          echo "::endgroup::"

          # UN SALTO SE DECLARA, NO SE ADIVINA: la marca es `INCONCLUSO:` al principio de la
          # línea, en columna 0. Contar la palabra suelta no vale, y se probó dos veces el
          # 17/09. En minúsculas es el nombre de aserciones que PASAN («exit 2 inconcluso,
          # nunca 0»); en mayúsculas la usan tanto el resumen de un banco como el nombre de
          # una prueba sobre inconclusos. Las dos veces el contador dijo de más, y un aviso
          # que sobra en cada run acaba siendo un aviso que nadie lee.
          n=$(printf '%s\n' "$salida" | grep -c '^INCONCLUSO:')
          [ -z "$n" ] && n=0
          saltos=$((saltos + n))

          if [ "$codigo" -eq 0 ]; then
            estado="verde"
          else
            estado="ROJO ($codigo)"
            fallos=$((fallos + 1))
            rojos="$rojos $nombre"
          fi
          echo "| \`$nombre\` | $estado | $n |" >> "$GITHUB_STEP_SUMMARY"
        done

        echo
        echo "${#BANCOS[@]} bancos · $fallos en rojo · $saltos aviso(s) de INCONCLUSO"
        {
          echo
          echo "**${#BANCOS[@]} bancos · $fallos en rojo · $saltos aviso(s) de INCONCLUSO**"
        } >> "$GITHUB_STEP_SUMMARY"

        # Un inconcluso NO pinta rojo: no significa que algo esté mal, sino que no se ha podido
        # comprobar (CIMA caído). Pintarlo rojo enseñaría a ignorar el rojo. Pero tampoco puede
        # pasar callado, que es el aprobado en falso: sale como aviso, y los avisos se ven en la
        # cabecera del run sin abrir nada.
        #
        # OJO EN EL GATE DE UN ETL: esto significa que un inconcluso NO bloquea la publicación.
        # Es deliberado —CIMA caído no puede impedir publicar un índice del Ministerio— pero hay
        # que saberlo: el gate protege contra un índice que rompe una aserción EJECUTADA, no
        # contra todo.
        if [ "$saltos" -gt 0 ]; then
          echo "::warning::$saltos aviso(s) de INCONCLUSO: hay comprobaciones que no se han podido hacer. El verde de este run no las cubre."
        fi

        if [ "$fallos" -gt 0 ]; then
          echo "::error::$fallos banco(s) en rojo:$rojos"
          exit 1
        fi

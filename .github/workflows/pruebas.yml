name: Bancos de pruebas de MedCheck

# Los bancos existían y no los ejecutaba nadie más que la máquina de casa: el repositorio tenía
# nueve ETL programados y `grep -rn "medcheck-test" .github/` no devolvía nada. Esto cierra el
# hueco del CÓDIGO.
#
# EL HUECO DEL DATO YA NO ESTÁ ABIERTO, pero solo en cinco de los nueve ETL. Los ETL commitean con
# el `GITHUB_TOKEN` por defecto y GitHub NO dispara workflows con esos push, así que un índice
# nuevo nunca llegará a este workflow. Se cierra por el otro lado: los cinco ETL que commitean al
# repo (`atc-index`, `financiacion`, `materiales`, `medynut`, `packs`) ejecutan estos mismos
# bancos ANTES de commitear, con `.github/actions/bancos`, que es el mismo bucle que se usa aquí.
#
# LO QUE SIGUE SIN CUBRIR, escrito para que nadie lo dé por cubierto: los otros cuatro ETL
# (`bifimed`, `biomarkers`, `sns-catalog`, `utilizacion`) NO commitean nada — publican a
# Cloudflare KV. Los bancos leen ficheros del repo, así que el gate no los toca ni podría. Cada
# uno tiene sus propias validaciones internas y eso es otra cosa, que no es cobertura de bancos.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura. Esto no commitea, no publica, no toca KV y no usa ningún secret. Con esto, el
# token del run no podría escribir aunque alguien lo intentara.
permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  # Sin `cancel-in-progress`: un run cancelado se lee como rojo —`check-runs.mjs` cuenta como
  # problema todo lo que no sea `success`— y un rojo que no significa nada enseña a ignorar los
  # rojos. Cincuenta segundos de cola son más baratos que eso.
  cancel-in-progress: false

jobs:
  bancos:
    runs-on: ubuntu-latest
    # Medido el 17/09/2026: los 32 en secuencial suman 46,3 s. El margen es para un CIMA lento,
    # no para un banco que se cuelga.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # El bucle, la guarda de arranque y la versión de Node viven en la acción compuesta, para
      # que este CI y el gate de los ETL no puedan divergir. Ver `.github/actions/bancos`.
      - uses: ./.github/actions/bancos
